<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sayfa Bulunamadı | Pınar Yalçın</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#14213D">
  <!-- GitHub Pages 404 sayfası farklı adreslerden açılabildiği için bu sayfadaki yollar
       alan adının köküne göre (/ ile başlayarak) yazılmıştır. -->
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* Bu sayfada tek sütun, ortalanmış düzen */
    .hero-inner { grid-template-columns: 1fr !important; text-align: center !important; }
    .hero .eyebrow, .hero-actions { justify-content: center !important; }
    .hero-lead { min-height: 0; margin: 0 auto 2rem !important; }
  </style>
</head>
<body>
  <main class="hero" style="min-height:100vh">
    <div class="container hero-inner">
      <div>
        <p class="eyebrow eyebrow-light">404</p>
        <h1 class="hero-title">Sayfa bulunamadı</h1>
        <p class="hero-lead">Aradığınız sayfa taşınmış veya kaldırılmış olabilir.</p>
        <div class="hero-actions">
          <a class="btn btn-gold" href="/">Ana Sayfaya Dön</a>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
